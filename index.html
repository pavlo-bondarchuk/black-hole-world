<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071018">
  <meta name="description" content="Black Hole World — an arcade browser game about swallowing a city, port, sea and islands.">
  <title>Black Hole World</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <main id="app">
    <header id="hud">
      <div class="brand">
        <strong>BLACK HOLE</strong>
        <span>WORLD</span>
      </div>
      <div class="hud-stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="hud-stat"><span>Size</span><strong id="size">1.6 m</strong></div>
    </header>

    <div id="combo">x1</div>

    <div id="message" hidden></div>
    <canvas id="game" aria-label="Black Hole World game"></canvas>
  </main>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
